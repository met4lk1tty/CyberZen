services:
  postgres:
    container_name: zendo-database
    image: postgres:16.0
    environment:
      POSTGRES_USER: zendo
      POSTGRES_PASSWORD: zendo
      POSTGRES_DB: zendo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
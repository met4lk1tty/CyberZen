server:
  port: 8080
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: Zendo

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/zendo_db
    username: zendo
    password: zendo

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  thymeleaf:
    cache: false

logging:
  level:
    root: INFO
    org:
      example:
        zendo: DEBUG
      springframework:
        security: INFO
        web: INFO
    org.hibernate:
      SQL: DEBUG
      type:
        descriptor:
          sql:
            BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"